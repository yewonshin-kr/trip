<style>
:root{--bg:#faf9ff;--card:#fff;--ink:#17151e;--muted:#7d7889;--line:#ece8f1;--purple:#8659d8;--purple2:#a67de7;--lav:#f3ecff;--pink:#fff0f6;--danger:#eb667f;--shadow:0 12px 30px rgba(86,61,128,.09)}

button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.shell{width:min(100%,500px);min-height:100vh;margin:auto;background:linear-gradient(#fff,#fbf9ff);padding-bottom:96px;position:relative;overflow:visible}
.page{display:none;padding:20px 16px 34px;animation:fade .22s ease}.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

h1{font-size:25px;margin:0;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted)}
.card{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.hero{height:240px;padding:21px;position:relative;overflow:hidden;background:radial-gradient(circle at 85% 14%,#f8dce8,transparent 38%),linear-gradient(135deg,#eee4ff,#fff5fa)}
.hero h2{font-size:23px;margin:4px 0 7px}.hero .date{font-size:14px;line-height:1.55}.hero .d{display:inline-block;margin-top:12px;padding:8px 13px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-weight:900}
.hero img{position:absolute;right:-8px;bottom:-22px;width:218px;height:218px;object-fit:contain}
.hero .hand{position:absolute;left:21px;bottom:16px;font-family:cursive;font-size:15px}
.flight{margin-top:12px;padding:16px}.flight .label{font-size:13px;font-weight:900;margin-bottom:10px}.flight.return{background:linear-gradient(135deg,#fff,#fbf8ff)}
.route{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center}.airport{text-align:center}.airport b{font-size:25px}.airport small{display:block;margin-top:4px;color:var(--muted);line-height:1.45}.plane{text-align:center;color:#7550c9}.plane:before,.plane:after{content:"";display:inline-block;width:18px;height:1px;background:#ddd8e7;vertical-align:middle}.plane span{padding:0 5px}.flightmeta{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px;margin-top:13px;font-size:11px;color:var(--muted)}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.menu{background:#fff;border:1px solid var(--line);border-radius:19px;padding:12px 4px;box-shadow:0 7px 17px rgba(75,56,110,.05)}.menu .mi{display:grid;place-items:center;width:46px;height:46px;margin:auto;border-radius:15px;background:linear-gradient(145deg,#f4ecff,#fff2f7)}.menu svg{width:25px;height:25px;stroke:#7650c8}.menu b{display:block;margin-top:7px;font-size:12px}

.tripcard{display:flex;align-items:center;gap:13px;padding:15px;margin-bottom:11px}.tripcover{width:66px;height:66px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#eee4ff,#fff0f5);font-size:30px}.tripcopy{flex:1}.tripcopy b{display:block}.tripcopy small{display:block;color:var(--muted);line-height:1.5;margin-top:4px}
.addlink,.plus{color:#6841bd;background:none;font-weight:900}.plus{font-size:29px}
.dates,.jump,.fastcats{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.dates::-webkit-scrollbar,.jump::-webkit-scrollbar,.fastcats::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:10px 12px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:11px}.chip.active{color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));border-color:transparent}
.schedule{margin-top:12px;padding:6px 14px}.row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.time{width:48px;font-size:12px;font-weight:900}.copy{flex:1}.copy b{font-size:14px}.copy small{display:block;color:var(--muted);margin-top:4px}.rowactions{display:flex;gap:5px}.editbtn,.deletebtn{padding:7px 9px;border-radius:10px;font-size:11px;font-weight:900}.editbtn{background:#f0e9fd;color:#6841bd}.deletebtn{background:#fff0f3;color:#df5f76}.drag{color:#bbb5c4;font-size:20px;cursor:grab}.dragging{opacity:.4}
.bigbtn{width:100%;margin-top:13px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-weight:900;box-shadow:0 10px 20px rgba(119,75,192,.18)}
.jump{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:35;margin:0 -16px 12px;padding:10px 16px 11px;background:rgba(250,249,255,.97);border-bottom:1px solid rgba(226,220,235,.9);box-shadow:0 8px 18px rgba(72,52,110,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.jump .chip{border-radius:17px;padding:10px 12px;text-align:center;min-width:74px}
.cat{padding:14px;margin-bottom:11px;scroll-margin-top:84px}.cathead{display:flex;justify-content:space-between;align-items:center}.cathead h3{font-size:15px;margin:0}.count{color:#734ac4;font-size:12px}.check{width:21px;height:21px}.addrow{display:flex;gap:8px;margin-top:9px}input,textarea,select{width:100%;padding:12px;border:1px solid #e4dfeb;border-radius:13px;outline:none;background:#fff}.smallbtn{padding:10px 13px;border-radius:13px;background:#f0e9fc;color:#6941bb;font-weight:900}
.outfitrow{display:flex;gap:10px;align-items:center}.look{display:flex;gap:7px;flex-wrap:wrap}.look span{padding:7px 9px;border-radius:11px;background:#fbf6ff;font-size:12px}
.memo{padding:15px;margin-top:12px;background:linear-gradient(135deg,#f6efff,#fff4f8);position:relative;min-height:120px}.memo img{position:absolute;right:3px;bottom:-10px;width:120px}
.budget{padding:17px}.budgethead{display:flex;justify-content:space-between;align-items:center}.amount{font-size:27px;font-weight:950}.budget input{font-size:18px;font-weight:800}.bar{height:9px;background:#e9e4ef;border-radius:99px;overflow:hidden;margin:13px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));width:0}.budgetstats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.summary{margin-top:12px;padding:16px}.donut:after{content:"";position:absolute;inset:21px;background:#fff;border-radius:50%}
.fast{padding:15px;margin-top:12px}.fastcats{margin:11px 0}.fastcats button{flex:0 0 auto;padding:11px;border-radius:14px;background:#f5efff}.fastcats button.active{background:#e9dcfb;color:#6039ab}.fastrow{display:grid;grid-template-columns:1fr 105px;gap:8px}.fastrow button{border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));font-weight:900}.expenses{padding:6px 15px;margin-top:12px}.exp{display:flex;padding:13px 0;border-bottom:1px solid var(--line)}.exp:last-child{border:0}.exp strong{font-size:13px}
.settingCard{padding:4px 16px}.settingRow{display:flex;align-items:center;gap:11px;padding:17px 0;border-bottom:1px solid var(--line)}.settingRow:last-child{border:0}.settingIcon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f3ecff;font-size:20px}.settingCopy{flex:1}.settingCopy b{display:block;font-size:14px}.settingCopy small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.danger{color:var(--danger)}
.note{padding:15px;margin-top:12px}.notice{font-size:11px;color:#858099;line-height:1.7;padding:14px 8px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,500px);height:84px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20}.nav button{background:none;color:#625d6b;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav button.active{color:#7449c7}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.sheetback{display:none;position:fixed;inset:0;background:rgba(29,22,42,.35);z-index:50;align-items:flex-end;justify-content:center}.sheetback.show{display:flex}.sheet{width:min(100%,500px);background:#fff;border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}@keyframes up{from{transform:translateY(100%)}to{transform:none}}.handle{width:40px;height:5px;background:#ddd9e3;border-radius:99px;margin:0 auto 16px}.sheet h3{margin:0 0 13px}.sheetgrid{display:grid;gap:9px}.sheetactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sheetactions button{padding:12px;border-radius:14px;font-weight:900}.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}.secondary{background:#f1eafb;color:#6740b6}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(15px);opacity:0;background:#221d2c;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;transition:.2s;z-index:70}.toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:700px){body{padding:20px}.shell{border-radius:34px;box-shadow:0 30px 80px rgba(65,49,90,.16)}.nav{bottom:20px;border-radius:25px}}


.hero.sapporo{
  min-height:286px;overflow:hidden;position:relative;padding:26px 22px;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.2)),linear-gradient(145deg,#c9c4ff 0%,#b9d8ff 46%,#dcead5 100%);
  border:1px solid rgba(255,255,255,.72);box-shadow:0 22px 46px rgba(72,65,125,.2)
}
.hero.sapporo .skyglow{position:absolute;width:145px;height:145px;right:-25px;top:-34px;border-radius:50%;background:radial-gradient(circle,rgba(255,252,220,.95) 0 22%,rgba(255,249,214,.38) 48%,transparent 72%);z-index:-1}
.hero.sapporo .cloud{position:absolute;width:92px;height:25px;border-radius:999px;background:rgba(255,255,255,.62);z-index:-1}
.hero.sapporo .cloud:before,.hero.sapporo .cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
.hero.sapporo .cloud:before{width:34px;height:34px;left:17px;top:-14px}
.hero.sapporo .cloud:after{width:44px;height:44px;right:13px;top:-21px}
.hero.sapporo .cloud.c1{right:33px;top:64px;transform:scale(.72)}
.hero.sapporo .cloud.c2{left:-12px;top:104px;transform:scale(.52);opacity:.72}
.hero.sapporo .cityscape{
  position:absolute;left:0;right:0;bottom:0;height:108px;z-index:-1;
  background:
    linear-gradient(90deg,transparent 0 7%,#8394a9 7% 13%,transparent 13% 18%,#71869f 18% 23%,transparent 23% 31%,#647c97 31% 36%,transparent 36% 44%,#7f91a8 44% 51%,transparent 51% 59%,#69819c 59% 66%,transparent 66% 73%,#8496aa 73% 80%,transparent 80% 87%,#6b8199 87% 92%,transparent 92%) bottom/100% 48% no-repeat,
    linear-gradient(165deg,transparent 0 42%,rgba(102,133,91,.9) 43% 61%,transparent 62%) left bottom/56% 86% no-repeat,
    linear-gradient(195deg,transparent 0 43%,rgba(121,151,102,.82) 44% 62%,transparent 63%) right bottom/64% 90% no-repeat,
    linear-gradient(180deg,transparent 0 50%,rgba(238,244,235,.95) 51% 100%)
}
.hero.sapporo .tower{position:absolute;right:62px;bottom:44px;width:5px;height:76px;border-radius:4px;background:#6d7189;z-index:0;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.hero.sapporo .tower:before{content:"";position:absolute;width:28px;height:10px;left:50%;top:18px;transform:translateX(-50%);border-radius:4px;background:#f0a9a9;box-shadow:0 10px 0 #ecebf8}
.hero.sapporo .tower:after{content:"";position:absolute;width:2px;height:19px;left:50%;top:-17px;transform:translateX(-50%);background:#6d7189}
.hero.sapporo .postcardtag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);font-size:10px;font-weight:900;letter-spacing:1.6px;color:#645a8f;box-shadow:0 8px 18px rgba(76,67,124,.1);position:relative;z-index:2}
.hero.sapporo h2{position:relative;z-index:2;margin:15px 0 7px;font-size:30px;letter-spacing:-1.3px;line-height:1.08;color:#35344f}
.hero.sapporo .subtitle{position:relative;z-index:2;font-size:12px;font-weight:700;color:#5c6481;margin-bottom:18px}
.hero.sapporo .tripinfo{position:relative;z-index:2;display:flex;align-items:center;gap:10px}
.hero.sapporo .datebox{padding:10px 12px;border-radius:15px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 22px rgba(70,66,112,.1)}
.hero.sapporo .date{font-size:13px;font-weight:900;line-height:1.35;color:#55536f}
.hero.sapporo .d{display:inline-flex;align-items:center;justify-content:center;min-width:63px;height:49px;border-radius:16px;background:#6650b8;color:#fff;font-size:15px;font-weight:950;box-shadow:0 12px 25px rgba(78,61,154,.28)}
.hero.sapporo .hand{position:absolute;left:22px;bottom:21px;z-index:2;font-size:11px;font-weight:850;color:#596269;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:6px 10px}
.hero.sapporo img{position:absolute;width:124px;right:-4px;bottom:6px;z-index:1;filter:drop-shadow(0 12px 16px rgba(61,61,96,.18))}
.outfitrow .rowactions{margin-left:auto}

/* ===== Trip Log generic redesign ===== */
:root{
  --bg:#f2f5f7;--card:#ffffff;--ink:#102a43;--muted:#748394;--line:#dce4e9;
  --purple:#ff6b4a;--purple2:#ff9e68;--lav:#fff0ea;--pink:#fff4ef;
  --danger:#d84d5f;--shadow:0 16px 40px rgba(16,42,67,.09);
}
html,body{background:#dfe7eb;color:var(--ink)}
.shell{background:#f5f7f8;padding-bottom:100px}
.page{padding:20px 17px 34px}
.card{border:1px solid rgba(16,42,67,.08);border-radius:22px;box-shadow:var(--shadow)}
.brandbar{height:54px;display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.wordmark{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:950;letter-spacing:1.8px}
.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#102a43;color:#fff;font-family:Georgia,serif;font-size:20px}
.profiledot{width:35px;height:35px;border-radius:50%;background:#fff;border:1px solid var(--line);color:#ff6b4a;font-weight:900}
.newhero{min-height:286px;padding:25px;position:relative;overflow:hidden;color:#fff;
 background:linear-gradient(145deg,#102a43 0%,#163f5c 57%,#235b72 100%)}
.hero-grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent)}
.eyebrow{position:relative;font-size:10px;font-weight:850;letter-spacing:2.4px;color:#ffb18b}
.newhero h2{position:relative;margin:38px 0 10px;font-size:36px;line-height:1.12;max-width:80%;letter-spacing:-1.8px}
.hero-date{position:relative;font-size:13px;color:rgba(255,255,255,.75);font-weight:650}
.route-badge{position:absolute;left:25px;bottom:24px;display:flex;align-items:center;gap:15px;padding:10px 14px;border:1px solid rgba(255,255,255,.24);border-radius:99px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);font-weight:950;letter-spacing:1.5px}
.route-badge i{font-style:normal;color:#ff9e68}
.hero-orbit{position:absolute;border:1px solid rgba(255,158,104,.52);border-radius:50%}
.orbit1{width:155px;height:155px;right:-50px;top:15px}.orbit2{width:95px;height:95px;right:22px;top:48px}
.orbit2:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#ff825f;right:4px;top:12px;box-shadow:0 0 0 8px rgba(255,130,95,.12)}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 20px}
.status-card{text-align:left;padding:14px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);min-width:0}
.status-card .status-icon{display:block;color:#ff6b4a;margin-bottom:13px;font-size:16px}
.status-card b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-card small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.section-label{display:flex;align-items:baseline;gap:10px;margin:6px 3px 10px}.section-label span{font-size:11px;font-weight:950;letter-spacing:2px}.section-label small{color:var(--muted)}
.top{margin-bottom:18px}.top h1{font-size:27px;letter-spacing:-1px}
.flight{padding:17px;margin-top:10px;box-shadow:none}.flight .label{color:#ff6b4a;letter-spacing:.3px}
.airport b{font-size:24px}.plane{color:#ff6b4a}
.chip.active,.bigbtn,.primary,.fastrow button{background:linear-gradient(135deg,#ff6b4a,#ff9e68)}
.chip.active{box-shadow:0 7px 14px rgba(255,107,74,.18)}
.plus,.addlink{color:#e75a3b}
.editbtn{background:#fff0ea;color:#db5639}.smallbtn{background:#fff0ea;color:#d95438}
.jump{background:rgba(245,247,248,.94)}
.bar i{background:linear-gradient(90deg,#ff6b4a,#ff9e68)}
.fastcats button.active{background:#ffe1d5;color:#b83e25}
.nav{background:rgba(255,255,255,.96);border-top-color:#dce4e9}.nav button.active{color:#ff6b4a}
.settingIcon{background:#fff0ea}
.logo{font-family:inherit;color:#102a43;font-size:20px;letter-spacing:1.4px;text-transform:uppercase}
.amount{letter-spacing:-1px}
@media(min-width:700px){body{padding:24px}.shell{border-radius:30px}}


/* ===== 가이드 (삿포로 정보) ===== */
.guide-card{padding:16px;margin-bottom:12px}
.guide-card h3{margin:0 0 4px;font-size:15px}
.guide-card>.sub{margin-bottom:6px}
.gaddr{font-size:12.5px;line-height:1.75;background:#f2f5f7;border-radius:13px;padding:12px;word-break:keep-all;margin-top:8px}
.guide details{border:1px solid var(--line);border-radius:14px;margin-top:9px;background:#fff;overflow:hidden}
.guide details summary{cursor:pointer;padding:12px 13px;font-size:13.5px;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px;user-select:none;-webkit-tap-highlight-color:transparent}
.guide details summary>span:first-child{flex:1;min-width:0}
.guide details summary::-webkit-details-marker{display:none}
.guide details summary::after{content:"▾";color:var(--muted);font-size:12px;transition:transform .2s}
.guide details[open]>summary::after{transform:rotate(180deg)}
.guide details[open]>summary{border-bottom:1px solid var(--line)}
.guide .gbody{padding:12px 13px;font-size:13px;line-height:1.7;word-break:keep-all}
.guide details details{margin:8px 0;border-color:#eef1f3}
.guide details details summary{background:#f8fafb;font-size:12.5px;padding:10px 12px}
.gtag{flex:0 0 auto;font-size:10.5px;font-weight:700;color:#fff;background:#ff6b4a;border-radius:99px;padding:2px 8px;white-space:nowrap}
.gtag.blue{background:#2e5d7d}.gtag.green{background:#2f9e63}
.groute{background:#f2f5f7;border-radius:12px;padding:10px 12px;line-height:1.85;word-break:keep-all}
.groute+.groute{margin-top:8px}
.arw{color:#ff6b4a;font-weight:900}
.gmeta{margin-top:8px;font-size:12.5px;color:#5c6b7a}
.gmeta strong,.gwarn{color:#e04f30}
.gnote{font-size:12px;color:var(--muted);margin-top:8px;word-break:keep-all;line-height:1.75}
.gtimes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.gtimes span{background:#fff0ea;border:1px solid #ffd9cb;border-radius:6px;padding:2px 6px;font-size:11.5px;font-variant-numeric:tabular-nums}
.gtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.gtable th,.gtable td{border:1px solid var(--line);padding:7px 8px;text-align:left}
.gtable th{background:#f2f5f7;white-space:nowrap}
.gtable td:first-child{white-space:nowrap;font-weight:700}

/* 코디 조합 칩 */
.outfit-chip{padding:9px 11px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:12px;word-break:keep-all;text-align:left}
.outfit-chip.active{color:#fff;background:linear-gradient(135deg,#ff6b4a,#ff9e68);border-color:transparent;font-weight:800}
.outfit-cat-label{font-size:12px;font-weight:900;margin:12px 2px 7px}
#outfitpreview{margin-top:10px;background:#fff0ea;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#b0431f;word-break:keep-all}

.private-badge{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:3px 7px;border-radius:999px;background:#e9f7ef;color:#217a4c;font-size:10px;font-weight:900;vertical-align:middle}
.private-empty{margin-top:10px;padding:14px;border:1px dashed #cbd7de;border-radius:14px;background:#f8fafb;color:var(--muted);font-size:12.5px;line-height:1.7}
.offline-note{padding:13px 15px;margin-top:12px;background:#eef6f8;border:1px solid #d5e6eb;border-radius:16px;color:#31586a;font-size:11.5px;line-height:1.65}
</style>

function load(){

 loaded.privateInfo={...defaults.privateInfo,...(saved.privateInfo||{})};
 loaded.schedules=loaded.schedules||{};

function dates(){
 const result=[];
 const [sy,sm,sd]=state.trip.start.split("-").map(Number);
 const [ey,em,ed]=state.trip.end.split("-").map(Number);
 const current=new Date(Date.UTC(sy,sm-1,sd));
 const end=new Date(Date.UTC(ey,em-1,ed));
 while(current<=end){
  const y=current.getUTCFullYear();
  const m=String(current.getUTCMonth()+1).padStart(2,"0");
  const d=String(current.getUTCDate()).padStart(2,"0");
  result.push(`${y}-${m}-${d}`);
  current.setUTCDate(current.getUTCDate()+1)
 }
 return result
}
function short(d){

}

<summary><span>🎟 리무진 버스 타는 법 &amp; 결제 팁</span></summary>
<div class="gbody">
<details><summary><span>어디서 타나 (자리 잡기 팁)</span></summary><div class="gbody">공항 내 정차 순서: <strong>국내선 ANA도착구(22번)</strong> <span class="arw">➞</span> <strong>국내선 JAL도착구(14번)</strong> <span class="arw">➞</span> <strong>국제선 터미널(84번)</strong> <span class="arw">➞</span> 삿포로 시내<br><br>국제선이 <strong>마지막 정차</strong>라 자리 선택권이 적음. 국내선 쪽이 식당도 훨씬 많으니 <strong>연결통로로 국내선 이동(도보 약 10분) → 저녁 식사 → 국내선 22번(ANA쪽) 승차장에서 탑승</strong>이 최적 동선. 첫 정류장이라 원하는 자리에 앉을 수 있음.<br><span class="gnote">※ 승차장은 국내선·국제선 모두 1층 도착 로비 바로 앞. 국내선 1층에 매표 카운터·자판기 있음 (프리미어호텔 츠바키 = 札幌都心선/후쿠즈미역 경유, 시간당 4대)</span></div></details>
<details><summary><span>⚠ 노선 확인 필수 — 아무 버스나 타면 안 됨</span></summary><div class="gbody">신치토세공항발 리무진은 <strong>11개 노선</strong>이 있고, 프리미어호텔 츠바키에 서는 건 <strong>札幌都心선 (삿포로 토신 / Sapporo Toshin · 후쿠즈미역 경유)</strong> 딱 하나.<br><br>· 버스 전면/승차장 표시에서 <strong>「札幌都心」(삿포로 토신 / Sapporo Toshin) + 「福住駅経由」(후쿠즈미에키 케이유 / Fukuzumi-eki keiyu)</strong> 확인<br>· <strong>「札幌都心 直行便」(삿포로 토신 촛코빈 / Chokkōbin = 직행편)은 다른 노선!</strong> — 삿포로역·스스키노 직행이라 츠바키에 안 섬<br>· 마코마나이·마루야마·오타루행 등도 당연히 X<br>· 헷갈리면 기사에게 "프리미어 호테루 츠바키?" 하고 확인 (버스 색은 무관 — 빨강/초록 모두 같은 노선 공동 운행)<br><br><span class="gnote">※ 국내선 22번 승차장은 도심선(후쿠즈미 경유) 전용이라 비교적 안전하지만, 국제선 84번은 여러 노선이 같이 쓰니 특히 주의</span></div></details>
<details><summary><span>예약 필요? 못 앉으면?</span></summary><div class="gbody"><strong>예약제 아님 — 전 좌석 선착순</strong>이고 애초에 좌석 예약이 불가능한 노선. 입석은 없어서 만석이면 다음 차를 타야 하지만 15분 간격이라 부담 없음. 혼잡 시엔 보조석을 운영하기도 함. 저녁 8시대 삿포로행은 러시 시간대도 아니라 크게 걱정할 필요 없음.</div></details>
<details><summary><span>이코카(ICOCA) 사용 — 주의!</span></summary><div class="gbody">두 회사가 공동 운행하는데 <strong>어느 회사 차가 올지는 복불복</strong>:<br><br>· <strong>중앙버스 (빨간 차체)</strong>: 이코카 등 전국 교통계 IC 카드 <strong>사용 가능</strong><br>· <strong>호쿠토교통 (초록 차체)</strong>: 교통계 IC 카드 <strong>사용 불가</strong> — 현금, 신용카드 터치결제, PayPay는 가능<br><br><span class="gnote">※ 초록 버스가 와도 당황하지 않도록 <strong>터치결제 되는 카드(트래블 카드)나 현금을 백업으로</strong> 준비. 또는 1층 카운터/자판기에서 표를 미리 사면 어느 회사 버스든 탑승 가능.</span></div></details>

function editOutfit(i){
 const d=dates()[i];
 const cats=state.packing.filter(c=>c.id==="clothes"||c.id==="shoes");
 const chipNames=cats.flatMap(c=>(c.items||[]).map(x=>x.t));
 const current=(state.outfits[i]&&state.outfits[i]!=="코디 미정")?state.outfits[i].split(" + "):[];
 outfitSel=current.filter(t=>chipNames.includes(t));
 const extra=current.filter(t=>!chipNames.includes(t)).join(" + ");
 $("sheetbody").innerHTML=`<h3>${short(d)} 코디 조합</h3><div class="sub">아래 준비물에서 골라 조합하세요</div>`+
  cats.map(c=>`<div class="outfit-cat-label">${c.icon} ${c.name}</div><div class="look">${(c.items||[]).map(x=>`<button type="button" class="outfit-chip ${outfitSel.includes(x.t)?"active":""}" data-t="${x.t.replaceAll('"',"&quot;")}" onclick="toggleOutfitChip(this)">${x.t}</button>`).join("")||`<span class="sub">항목이 없어요 — 준비물에서 먼저 추가하세요</span>`}</div>`).join("")+
  `<div style="margin-top:12px"><input id="outfitextra" value="${extra.replaceAll('"',"&quot;")}" placeholder="직접 추가 (예: 모자, 액세서리)" oninput="updateOutfitPreview()"></div>

 $("sheetback").classList.add("show");

}
function toggleOutfitChip(el){
 const t=el.dataset.t,k=outfitSel.indexOf(t);
 k>-1?outfitSel.splice(k,1):outfitSel.push(t);
 el.classList.toggle("active");updateOutfitPreview()
}
function updateOutfitPreview(){
 const extra=$("outfitextra")?.value.trim();
 const all=[...outfitSel,...(extra?[extra]:[])];
 const box=$("outfitpreview");
 if(box)box.textContent=all.length?"코디: "+all.join(" + "):"아직 선택한 항목이 없어요";
}

 const e=state.expenses[i],amount=Number($("eamount").value),date=$("edate").value,cat=$("ecat").value;
 if(!e||!date||!amount)return toastMsg("날짜와 금액을 입력해 주세요");
 e.date=date;e.title=$("etitle").value.trim()||cat;e.cat=cat;e.amount=amount;e.time=$("etime").value||"";
 ledgerDay=date;expenseCat=cat;save();closeSheet();ledgerRender();toastMsg("지출을 수정했어요")
}
function deleteExpense(i){
 if(!confirm("이 지출을 삭제할까요?"))return;
 state.expenses.splice(i,1);save();ledgerRender();toastMsg("지출을 삭제했어요")
}
function editPrivateInfo(){
 const p=state.privateInfo||defaults.privateInfo;
 $("sheetbody").innerHTML=`<h3>비공개 숙소 정보</h3><div class="sub" style="margin-bottom:12px">이 휴대폰의 브라우저에만 저장됩니다.</div><div class="sheetgrid">
 <input id="pstay" value="${esc(p.stayName)}" placeholder="숙소명">
 <input id="proom" value="${esc(p.room)}" placeholder="객실 정보">
 <textarea id="paddr" rows="3" placeholder="숙소 주소">${esc(p.address)}</textarea>
 <input id="pbook" value="${esc(p.bookingCode)}" placeholder="예약 번호">
 <input id="pmapcode" value="${esc(p.mapCode)}" placeholder="맵코드">
 <input id="pmapurl" type="url" value="${esc(p.mapUrl)}" placeholder="지도 URL">
 <input id="pguesturl" type="url" value="${esc(p.guestFormUrl)}" placeholder="투숙객 정보 제출 URL">
 <input id="pcheckin" value="${esc(p.checkinNote)}" placeholder="체크인 안내">
 <input id="pcheckout" value="${esc(p.checkoutNote)}" placeholder="체크아웃 안내">
 <input id="pguestnote" value="${esc(p.guestNote)}" placeholder="투숙객 제출 메모">
 </div><div class="sheetactions"><button class="secondary" onclick="closeSheet()">취소</button><button class="primary" onclick="savePrivateInfo()">저장</button></div>`;
 $("sheetback").classList.add("show")
}
function savePrivateInfo(){
 state.privateInfo={stayName:$("pstay").value.trim(),room:$("proom").value.trim(),address:$("paddr").value.trim(),bookingCode:$("pbook").value.trim(),mapCode:$("pmapcode").value.trim(),mapUrl:$("pmapurl").value.trim(),guestFormUrl:$("pguesturl").value.trim(),checkinNote:$("pcheckin").value.trim(),checkoutNote:$("pcheckout").value.trim(),guestNote:$("pguestnote").value.trim()};
 save();closeSheet();guideRender();moreRender();toastMsg("비공개 숙소 정보를 저장했어요")
}
function editBudget(){const n=Number(prompt("총 예산을 입력하세요",state.budget));if(!n)return;state.budget=n;save();ledgerRender()}
function editTrip(){$("sheetbody").innerHTML=`<h3>여행 정보 수정</h3><div class="sheetgrid"><input id="tname" value="${state.trip.name}"><input id="tstart" type="date" value="${state.trip.start}"><input id="tend" type="date" value="${state.trip.end}"><input id="tbook" value="${state.trip.booking||""}" placeholder="예약번호"><select id="tcurrency"><option ${state.trip.currency==="₩"?"selected":""}>₩</option><option ${state.trip.currency==="¥"?"selected":""}>¥</option><option ${state.trip.currency==="$"?"selected":""}>$</option><option ${state.trip.currency==="€"?"selected":""}>€</option></select></div><div class="sheetactions"><button class="secondary" onclick="closeSheet()">취소</button><button class="primary" onclick="saveTripEdit()">저장</button></div>`;$("sheetback").classList.add("show")}
function saveTripEdit(){state.trip.name=$("tname").value.trim()||state.trip.name;state.trip.start=$("tstart").value;state.trip.end=$("tend").value;state.trip.booking=$("tbook").value.trim();state.trip.currency=$("tcurrency").value;day=state.trip.start;ledgerDay=state.trip.start;save();closeSheet();homeRender();moreRender();toastMsg("여행 정보를 수정했어요")}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sapporo-trip-backup.json";a.click();URL.revokeObjectURL(a.href)}
$("restoreInput").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{state=JSON.parse(await f.text());day=state.trip.start;ledgerDay=state.trip.start;save();renderAll();toastMsg("백업을 복원했어요")}catch{toastMsg("복원할 수 없는 파일이에요")}e.target.value=""})
function deleteTrip(){if(!confirm("현재 여행의 모든 데이터를 삭제할까요?"))return;state=clone(defaults);day=state.trip.start;ledgerDay=state.trip.start;save();renderAll();toastMsg("기본 데이터로 초기화했어요")}
function drag(id,list){const c=$(id);if(!c)return;let d;c.querySelectorAll(".draggable").forEach(el=>{el.ondragstart=()=>{d=el;el.classList.add("dragging")};el.ondragend=()=>{el.classList.remove("dragging");state.schedules[day]=[...c.querySelectorAll(".draggable")].map(x=>list[+x.dataset.i]);save()};el.ondragover=e=>{e.preventDefault();const a=[...c.querySelectorAll(".draggable:not(.dragging)")].find(x=>e.clientY<x.getBoundingClientRect().top+x.offsetHeight/2);a?c.insertBefore(d,a):c.appendChild(d)}})}
function go(id){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));function goPage(name){
 document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===name));
 document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.p===name));
 if(name==="schedule")scheduleRender();
 if(name==="packing")packingRender();
 if(name==="ledger")ledgerRender();
 if(name==="more")moreRender();
 window.scrollTo({top:0,behavior:"smooth"})
}
document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===id));({home:homeRender,schedule:scheduleRender,guide:guideRender,packing:packingRender,ledger:ledgerRender,more:moreRender}[id])();scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.p))
function toastMsg(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}
window.goPage=go;
function renderAll(){homeRender();scheduleRender();guideRender();packingRender();ledgerRender();moreRender()}

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();deferredInstallPrompt=event;moreRender()});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;toastMsg("홈 화면에 설치했어요");moreRender()});
async function installApp(){
 if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;moreRender();return}
 toastMsg("Chrome 메뉴에서 ‘홈 화면에 추가’를 선택해 주세요")
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
if(navigator.storage?.persist){navigator.storage.persist().catch(()=>{})}

renderAll();
</script>
