<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Trip Log">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Log">
<title>삿포로 Trip Log</title>
<link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
<div class="shell">
<section id="home" class="page active"></section><section id="schedule" class="page"></section><section id="packing" class="page"></section><section id="ledger" class="page"></section><section id="guide" class="page"></section><section id="more" class="page"></section>
</div>
<nav class="nav">
<button data-p="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg><span>여행</span></button>

<button data-p="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>일정</span></button>
<button data-p="guide"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15M15 6v15"/></svg><span>가이드</span></button>
<button data-p="packing"><svg viewBox="0 0 24 24"><rect x="6" y="7" width="12" height="14" rx="3"/><path d="M9 7V5h6v2M9 11h6"/></svg><span>준비물</span></button>
<button data-p="ledger"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14h2"/></svg><span>가계부</span></button>
<button data-p="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg><span>기타</span></button>
</nav>
<div id="sheetback" class="sheetback" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><div id="sheetbody"></div></div></div>
<input id="restoreInput" type="file" accept="application/json" hidden>
<div id="toast" class="toast"></div>
<script src="./app.js?v=4" defer></script>
</body>
</html>
